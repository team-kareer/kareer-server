spring:
  config:
    activate:
      on-profile: test

  application:
    name: kareer-test

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
        show_sql: false
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      password: TestRedisHost
  servlet:
    multipart:
      max-file-size: 40MB
      max-request-size: 40MB
  ai:
    openai:
      api-key: TestOpenaiKey
      chat:
        options:
          model: gpt-4.1-mini
          temperature: 0.5
      embedding:
        options:
          model: text-embedding-3-small
  clova:
    ocr:
      url: test
      secret: test
      timeout-ms: 15000
  rag:
    roadmap:
      policy-top-k: 4
      career-action-top-k: 4
      career-guide-top-k: 4
      career-todo-top-k: 6
      candidate-pool-top-k: 30
    vector-store:
      enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test
            client-secret: testtesttesttest
            redirect-uri: testtesttest
            scope:
              - openid
              - profile
              - email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub
      redirect:
        redirect-uri: test

jwt:
  secret: testJwtSecret
  access-token:
    expiration-seconds: 3600000
  refresh-token:
    expiration-seconds: 12000000
auth:
  login-code:
    ttl-seconds: 60
    redis-prefix: test
  cookie:
    refresh-token:
      name: test
      secure: false
      same-site: test
swagger:
  auth:
    username: ddd
    password: dd